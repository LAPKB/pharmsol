version: 2
updates:
  - package-ecosystem: "cargo" 
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cranelift:
        patterns:
          - "cranelift*"
      diffsol:
        patterns:
          - "diffsol*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
